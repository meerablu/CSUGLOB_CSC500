
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Pet Appointment Wireframe</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; }
    .container {
      max-width: 420px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 28px 24px 24px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .form-title {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
    .photo-upload {
      width: 80px;
      height: 80px;
      background: #f0f0f0;
      border: 2px dashed #bbb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      margin: 0 auto 18px auto;
      font-size: 2em;
      cursor: pointer;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    select, input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 1em;
      margin-bottom: 6px;
    }
    .inline-group {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .inline-group input[type="radio"], .inline-group input[type="checkbox"] {
      width: auto;
      margin-right: 4px;
    }
    .reminder-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      margin-bottom: 6px;
    }
    .reminder-group label {
      font-weight: normal;
      margin-bottom: 0;
    }
    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    button {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 4px;
      background: #1976d2;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
    }
    button.cancel {
      background: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-title">Add Pet Appointment</div>
    <div class="photo-upload">🐶</div>
    <div class="form-group">
      <label for="pet-name">Pet Name:</label>
      <select id="pet-name">
        <option>Select pet</option>
        <option>Bella</option>
        <option>Max</option>
        <option>Daisy</option>
      </select>
    </div>
    <div class="form-group">
      <label>Appointment Type:</label>
      <div class="inline-group">
        <input type="radio" id="vet" name="appt-type">
        <label for="vet">Vet Visit</label>
        <input type="radio" id="vaccination" name="appt-type">
        <label for="vaccination">Vaccination</label>
        <input type="radio" id="grooming" name="appt-type">
        <label for="grooming">Grooming</label>
        <input type="radio" id="other" name="appt-type">
        <label for="other">Other:</label>
        <input type="text" placeholder="Other type">
      </div>
    </div>
    <div class="form-group">
      <label for="appt-date">Appointment Date:</label>
      <input type="date" id="appt-date">
    </div>
    <div class="form-group">
      <label for="appt-time">Appointment Time:</label>
      <input type="text" id="appt-time" placeholder=": AM/PM">
    </div>
    <div class="form-group">
      <label for="appt-notes">Appointment Notes:</label>
      <textarea id="appt-notes" rows="2" placeholder="Enter notes"></textarea>
    </div>
    <div class="form-group">
      <label>Reminder:</label>
      <div class="reminder-group">
        <input type="checkbox" id="reminder1">
