
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings Wireframe</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; }
    .container {
      max-width: 400px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 28px 24px 24px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .section-title {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 18px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    select, input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 1em;
    }
    .account-id {
      font-size: 0.98em;
      color: #888;
      margin-bottom: 10px;
    }
    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      margin-bottom: 10px;
    }
    button {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 4px;
      background: #1976d2;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
    }
    button.cancel {
      background: #aaa;
    }
    .logout-btn {
      width: 100%;
      margin-top: 18px;
      background: #43a047;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="section-title">Settings</div>
    <div class="form-group">
      <label for="theme">App Theme:</label>
      <select id="theme">
        <option>Light</option>
        <option>Dark</option>
        <option>Custom</option>
      </select>
    </div>
    <div class="section-title" style="font-size:1em; margin-bottom:8px;">Account Information</div>
    <div class="account-id">Account ID: 101223347</div>
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" value="Karen Chai">
    </div>
    <div class="form-group">
      <label for="address">Address:</label>
      <input type="text" id="address" value="105 Summer Pl Drive Tx 75019">
    </div>
    <div class="form-group">
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" value="469-968-7105">
    </div>
    <div class="button-row">
      <button type="submit">Update Account Info</button>
      <button type="button" class="cancel">Cancel</button>
    </div>
    <button class="logout-btn">Log Out</button>
  </div>
</body>
</html>
