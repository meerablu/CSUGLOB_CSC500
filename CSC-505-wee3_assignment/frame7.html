
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update a Pet Wireframe</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; }
    .container {
      max-width: 400px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 28px 24px 24px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .form-title {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
    .photo-upload {
      width: 100%;
      height: 120px;
      background: #f0f0f0;
      border: 2px dashed #bbb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      margin-bottom: 18px;
      cursor: pointer;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type="text"], input[type="date"], select {
      width: 100%;
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 1em;
    }
    .pet-type-group, .gender-group, .spayed-group, .rip-group {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 6px;
    }
    .pet-type-group select {
      flex: 1;
    }
    .gender-group label, .spayed-group label, .rip-group label {
      font-weight: normal;
      margin-bottom: 0;
    }
    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    button {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 4px;
      background: #1976d2;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
    }
    button.cancel {
      background: #aaa;
    }
    .back-btn {
      width: 100%;
      margin-top: 18px;
      background: #43a047;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-title">Update a Pet ++</div>
    <div class="photo-upload">
      🐶🐶 Pet Photo Upload Area<br>
      <span style="font-size:0.95em;">(Tap to add/change photo: camera/gallery)</span>
    </div>
    <div class="form-group">
      <label for="pet-name">Name of Pet:</label>
      <input type="text" id="pet-name" value="Max">
    </div>
    <div class="form-group">
      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" value="2021-08-10">
    </div>
    <div class="form-group">
      <label>Pet Type:</label>
      <div class="pet-type-group">
        <select>
          <option selected>Dog</option>
          <option>Cat</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Gender:</label>
      <div class="gender-group">
        <input type="radio" id="male" name="gender" checked>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>
      </div>
    </div>
    <div class="form-group">
      <label for="breed">Breed:</label>
      <input type="text" id="breed" value="Golden Retriever">
    </div>
    <div class="form-group">
      <label>Spayed/Neutered:</label>
      <div class="spayed-group">
        <select>
          <option selected>Yes</option>
          <option>No</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Pet RIP:</label>
      <div class="rip-group">
        <select>
          <option>No</option>
          <option>Yes</option>
          <option>NA</option>
        </select>
      </div>
    </div>
    <div class="button-row">
      <button type="submit">Save</button>
      <button type="button" class="cancel">Cancel</button>
    </div>
    <button class="back-btn">🏠 Back to Home</button>
  </div>
</body>
</html>
