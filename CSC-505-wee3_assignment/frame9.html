
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Pet Special Regimen Care Wireframe</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; }
    .container {
      max-width: 420px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 28px 24px 24px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .form-title {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
    .photo-upload {
      width: 80px;
      height: 80px;
      background: #f0f0f0;
      border: 2px dashed #bbb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      margin: 0 auto 18px auto;
      font-size: 2em;
      cursor: pointer;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    select, input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 1em;
      margin-bottom: 6px;
    }
    .inline-group {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 6px;
    }
    .inline-group input[type="number"] {
      width: 60px;
    }
    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    button {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 4px;
      background: #1976d2;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
    }
    button.cancel {
      background: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-title">Add Pet Special Regimen Care</div>
    <div class="photo-upload">🐶</div>
    <div class="form-group">
      <label for="pet-name">Pet Name:</label>
      <select id="pet-name">
        <option>Select pet</option>
        <option>Bella</option>
        <option>Max</option>
        <option>Daisy</option>
      </select>
    </div>
    <div class="form-group">
      <label>Feeding Schedule:</label>
      <div class="inline-group">
        Feed <input type="number" min="1" value="2"> times per day
      </div>
      <div class="inline-group">
        - Time 1: <input type="text" placeholder=": AM/PM">
        - Time 2: <input type="text" placeholder=": AM/PM">
      </div>
    </div>
    <div class="form-group">
      <label>Potty Breaks:</label>
      <div class="inline-group">
        - Pee Time(s): <input type="text" placeholder=": AM/PM">, <input type="text" placeholder=": AM/PM">
      </div>
      <div class="inline-group">
        - Poop Time(s): <input type="text" placeholder=": AM/PM">, <input type="text" placeholder=": AM/PM">
      </div>
    </div>
    <div class="form-group">
      <label>Special Treat:</label>
      <div class="inline-group">
        <input type="checkbox" id="special-treat">
        <label for="special-treat">Give special treat once a week if pet behaves well</label>
      </div>
      <div class="inline-group">
        - Day of Week: 
        <select>
          <option>Sunday</option>
          <option>Monday</option>
          <option>Tuesday</option>
          <option>Wednesday</option>
          <option>Thursday</option>
          <option>Friday</option>
          <option>Saturday</option>
        </select>
      </div>
      <div class="inline-group">
        - Treat Type: <input type="text" placeholder="Treat type">
      </div>
    </div>
    <div class="form-group">
      <label for="notes">Additional Notes:</label>
      <textarea id="notes" rows="3" placeholder="Enter any additional notes"></textarea>
    </div>
    <div class="button-row">
      <button type="submit">Save Regimen</button>
      <button type="button" class="cancel">Cancel</button>
    </div>
  </div>
</body>
</html>
