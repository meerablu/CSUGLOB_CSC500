
<!DOCTYPE html>
<html>
<head>
  <title>Add a Pet ++ (Wireframe)</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; }
    .container {
      width: 400px; margin: 40px auto; background: #fff; padding: 24px;
      border-radius: 8px; box-shadow: 0 0 10px #ccc;
    }
    .section { margin-bottom: 18px; }
    .label { font-weight: bold; display: block; margin-bottom: 6px; }
    .input, select { width: 100%; padding: 6px; margin-bottom: 8px; }
    .radio-group, .toggle-group { margin-bottom: 8px; }
    .actions { text-align: center; margin-top: 18px; }
    .actions button { width: 100px; padding: 8px; margin: 0 8px; }
    .photo-area {
      background: #eee; border: 1px dashed #bbb; padding: 16px; text-align: center;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Add a Pet ++</h2>
    <div class="section photo-area">
      [Pet Photo Upload Area]<br>
      <small>(Tap to add/change photo: camera/gallery)</small>
    </div>
    <div class="section">
      <label class="label">Name of Pet:</label>
      <input class="input" type="text" placeholder="Daisy">
    </div>
    <div class="section">
      <label class="label">Date of Birth:</label>
      <input class="input" type="date">
    </div>
    <div class="section">
      <label class="label">Pet Type:</label>
      <select class="input">
        <option>Dog</option>
        <option>Cat</option>
        <option>Other</option>
      </select>
    </div>
    <div class="section radio-group">
      <label class="label">Gender:</label>
      <label><input type="radio" name="gender"> Male</label>
      <label><input type="radio" name="gender"> Female</label>
    </div>
    <div class="section">
      <label class="label">Breed:</label>
      <input class="input" type="text" placeholder="Enter breed">
    </div>
    <div class="section toggle-group">
      <label class="label">Spayed/Neutered:</label>
      <select class="input">
        <option>Yes</option>
        <option>No</option>
      </select>
    </div>
    <div class="actions">
      <button type="submit">Save</button>
      <button type="button">Cancel</button>
    </div>
  </div>
</body>
</html>
