
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form Wireframe</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; }
    .login-container {
      width: 320px;
      margin: 80px auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 32px 24px 24px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .logo {
      display: block;
      margin: 0 auto 18px auto;
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .login-title {
      text-align: center;
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 1em;
    }
    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    button {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 4px;
      background: #1976d2;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
    }
    button.cancel {
      background: #aaa;
    }
    .forgot {
      text-align: center;
      color: #1976d2;
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.95em;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    
    <div class="login-title">Habbi Pet Login</div>
	<form method="POST" id="form_login">
    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" value="karen">
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" value="pass">
    </div>
    <div class="button-row">
      <button type="submit">Login</button>
      <button type="button" class="cancel">Cancel</button>
    </div>
	</form>
    <div class="forgot">Forgot password?</div>
  </div>
</body>
</html>
